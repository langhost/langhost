sonar.projectKey=langhost_langhost
sonar.organization=langhost
sonar.projectName=langhost
sonar.sources=libs
sonar.tests=libs
sonar.test.inclusions=**/tests/**
sonar.python.version=3.11,3.12,3.13
sonar.sourceEncoding=UTF-8

# Alembic revision scripts are auto-generated (alembic revision --autogenerate).
# Analyzing them produces noisy smells (duplicated server_default literals, etc.)
# without actionable signal — exclude the whole versions tree.
sonar.exclusions=**/migrations/versions/**
