name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Full lint / build / e2e must pass before any upload.
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Build
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Lockfile + version lockstep
        run: |
          uv lock --check
          python3 scripts/check_versions.py

      - name: Tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          RUNTIME="$(uv version --package langgraph-runtime-pg --short)"
          LANGHOST="$(uv version --package langhost --short)"
          echo "tag=${TAG} runtime=${RUNTIME} langhost=${LANGHOST}"
          if [[ "${TAG}" != "${RUNTIME}" || "${TAG}" != "${LANGHOST}" ]]; then
            echo "Tag v${TAG} must match both package versions (got runtime=${RUNTIME}, langhost=${LANGHOST})" >&2
            exit 1
          fi

      - name: Build
        run: |
          rm -rf dist
          uv build --package langgraph-runtime-pg
          uv build --package langhost
          ls -la dist

      - name: Smoke import wheels
        run: |
          RUNTIME_WHL="$(ls dist/langgraph_runtime_pg-*.whl | head -n1)"
          LANGHOST_WHL="$(ls dist/langhost-*.whl | head -n1)"
          # Exact built wheel paths — no unlocked package names from an index.
          # NOSONAR - wheel path is a pinned local artifact, not index resolution
          uv run --isolated --no-project --with "${RUNTIME_WHL}" \
            python -c "import langgraph_runtime_pg; print(langgraph_runtime_pg.__name__)"
          # NOSONAR - wheel paths are pinned local artifacts, not index resolution
          uv run --isolated --no-project --with "${RUNTIME_WHL}" --with "${LANGHOST_WHL}" \
            python -c "import langhost; print(langhost.__name__)"
      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-langhost:
    name: Publish langhost
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-langhost
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)

    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist

      # No checkout here — disable cache so post-setup does not fail the job.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: "3.11"

      - name: Publish langhost to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/langhost-*

  publish-runtime:
    name: Publish langgraph-runtime-pg
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-runtime
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)

    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist

      # No checkout here — disable cache so post-setup does not fail the job.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: "3.11"

      - name: Publish langgraph-runtime-pg to PyPI
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/langgraph_runtime_pg-*

  github-release:
    name: GitHub Release
    needs: [publish-langhost, publish-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "v${VER}" \
            --generate-notes \
            --repo "${{ github.repository }}" \
            dist/*
