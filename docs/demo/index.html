<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>langhost quick start</title>
    <meta
      name="description"
      content="Interactive recording: uv add langhost → Postgres + Redis → langhost serve"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/asciinema-player@3.17.0/dist/bundle/asciinema-player.css"
      integrity="sha384-05cmIVRzN7mR7nmqajPpGPUPqJ5VyTAGHL1xJuiGWfhpWDp5hEfBk50kr21f3ILM"
      crossorigin="anonymous"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f14;
        --panel: #121820;
        --text: #e8eef5;
        --muted: #9aa7b5;
        --accent: #f5c542;
        --link: #7ec8ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          "IBM Plex Sans",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background:
          radial-gradient(1200px 600px at 50% -10%, #1a2740 0%, transparent 55%),
          var(--bg);
        color: var(--text);
      }

      main {
        width: min(960px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 2.5rem 0 3rem;
      }

      header {
        margin-bottom: 1.25rem;
      }

      h1 {
        margin: 0 0 0.35rem;
        font-size: clamp(1.4rem, 2.5vw, 1.85rem);
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .sub {
        margin: 0;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.45;
      }

      .player-shell {
        margin-top: 1.25rem;
        padding: 0.75rem;
        border: 1px solid #243041;
        border-radius: 12px;
        background: var(--panel);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }

      #player {
        width: 100%;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        margin-top: 1.1rem;
        font-size: 0.92rem;
      }

      a {
        color: var(--link);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .star {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>langhost quick start</h1>
        <p class="sub">
          Interactive terminal recording — pause, seek, and replay.
          Autoplaying preview lives in the README.
        </p>
      </header>

      <div class="player-shell">
        <div id="player"></div>
      </div>

      <div class="actions">
        <a href="https://github.com/langhost/langhost">GitHub repo</a>
        <a class="star" href="https://github.com/langhost/langhost/stargazers"
          >★ Star langhost</a
        >
        <a href="../assets/langhost-quickstart.cast">Download .cast</a>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/asciinema-player@3.17.0/dist/bundle/asciinema-player.min.js"
      integrity="sha384-s55nTYAdrPwGWmKKQ1lCnoB8H9LbqmsXsqqqPAHK2+T5h9IfI2dTXTDXJcZnySJD"
      crossorigin="anonymous"
    ></script>
    <script>
      AsciinemaPlayer.create(
        "../assets/langhost-quickstart.cast",
        document.getElementById("player"),
        {
          autoplay: true,
          preload: true,
          loop: false,
          fit: "width",
          theme: "asciinema",
          poster: "npt:0:00",
          idleTimeLimit: 12,
        },
      );
    </script>
  </body>
</html>
